<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Ala-ala</title>
    <!-- Menghubungkan halaman dengan tiga sumber gaya, yaitu Tailwind CSS dari internet untuk membantu membuat tampilan lebih rapi, font Inter dari Google Fonts agar tulisan terlihat lebih bagus, dan file style.css yang berisi pengaturan tampilan tambahan buatan sendiri. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

</head>
<body class="bg-cyan-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-purple-800 rounded-2xl shadow-2xl p-6 space-y-4">
        
        <!-- Menampilkan gambar di atas kalkulator yang bisa berubah sesuai status (misalnya sukses atau error). -->
        <div>
            <img id="statusImage" 
                 src="https://placehold.co/400x100/374151/E5E7EB?text=Halidazia Fidya Shandara (1710624125)" 
                 alt="Status Kalkulator"
                 class="w-full rounded-lg transition-all duration-300 ease-in-out shadow-inner">
        </div>

        <!-- Layar kalkulator, tempat menampilkan angka atau hasil perhitungan, tapi tidak bisa diketik langsung karena hanya untuk menampilkan output. -->
        <div class="bg-gray-900 rounded-lg p-4 shadow-inner">
            <input type="text" id="display" 
                   class="w-full bg-transparent text-right text-5xl font-mono text-white border-0 outline-none p-2" 
                   readonly 
                   placeholder="0">
        </div>

        <!-- Membuat area tombol kalkulator dalam bentuk grid dengan 4 kolom dan jarak antar tombol. -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Membuat tombol fungsi dasar seperti hapus semua (C), hapus satu angka (DEL), persen (%), dan bagi (/). -->
            <button data-value="C" class="btn-calc text-2xl font-bold bg-red-600 hover:bg-red-500 rounded-lg p-5 shadow-md text-white">C</button>
            <button data-value="DEL" class="btn-calc text-2xl font-bold bg-pink-600 hover:bg-pink-500 rounded-lg p-5 shadow-md text-white">DEL</button>
            <button data-value="%" class="btn-calc text-2xl font-bold bg-pink-600 hover:bg-pink-500 rounded-lg p-5 shadow-md text-white">%</button>
            <button data-value="/" class="btn-calc text-2xl font-bold bg-blue-600 hover:bg-blue-500 rounded-lg p-5 shadow-md text-white">/</button>

            <!--  Membuat tombol angka 7, 8, 9, dan tombol perkalian (*). -->
            <button data-value="7" class="btn-calc text-2xl font-bold bg-violet-600 hover:bg-violet-400 rounded-lg p-5 shadow-md text-white">7</button>
            <button data-value="8" class="btn-calc text-2xl font-bold bg-violet-500 hover:bg-violet-400 rounded-lg p-5 shadow-md text-white">8</button>
            <button data-value="9" class="btn-calc text-2xl font-bold bg-violet-700 hover:bg-violet-400 rounded-lg p-5 shadow-md text-white">9</button>
            <button data-value="*" class="btn-calc text-2xl font-bold bg-blue-600 hover:bg-blue-500 rounded-lg p-5 shadow-md text-white">*</button>

            <!--  Membuat tombol angka 4, 5, 6, dan tombol pengurangan (-). -->
            <button data-value="4" class="btn-calc text-2xl font-bold bg-cyan-700 hover:bg-cyan-400 rounded-lg p-5 shadow-md text-white">4</button>
            <button data-value="5" class="btn-calc text-2xl font-bold bg-cyan-600 hover:bg-cyan-400 rounded-lg p-5 shadow-md text-white">5</button>
            <button data-value="6" class="btn-calc text-2xl font-bold bg-cyan-500 hover:bg-cyan-400 rounded-lg p-5 shadow-md text-white">6</button>
            <button data-value="-" class="btn-calc text-2xl font-bold bg-blue-600 hover:bg-blue-500 rounded-lg p-5 shadow-md text-white">-</button>

            <!--  Membuat tombol angka 1, 2, 3, dan tombol penjumlahan (+). -->
            <button data-value="1" class="btn-calc text-2xl font-bold bg-orange-500 hover:bg-orange-400 rounded-lg p-5 shadow-md text-white">1</button>
            <button data-value="2" class="btn-calc text-2xl font-bold bg-orange-700 hover:bg-orange-400 rounded-lg p-5 shadow-md text-white">2</button>
            <button data-value="3" class="btn-calc text-2xl font-bold bg-orange-600 hover:bg-orange-400 rounded-lg p-5 shadow-md text-white">3</button>
            <button data-value="+" class="btn-calc text-2xl font-bold bg-blue-600 hover:bg-blue-500 rounded-lg p-5 shadow-md text-white">+</button>

            <!--  Membuat tombol angka 0 (lebih lebar karena menempati dua kolom), tombol titik desimal, dan tombol sama dengan (=) untuk menghitung hasil.  -->
            <button data-value="0" class="btn-calc col-span-2 text-2xl font-bold bg-yellow-500 hover:bg-yellow-400 rounded-lg p-5 shadow-md text-white">0</button>
            <button data-value="." class="btn-calc text-2xl font-bold bg-yellow-600 hover:bg-yellow-400 rounded-lg p-5 shadow-md text-white">.</button>
            <button data-value="=" class="btn-calc text-2xl font-bold bg-green-600 hover:bg-green-500 rounded-lg p-5 shadow-md text-white">=</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
